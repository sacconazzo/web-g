<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ZAICO Attestations — GOLD</title>
  <desc>Medaglia circolare dorata con stella, nastro e testo ZAICO Attestations - livello GOLD.</desc>
  <metadata>
    {
      "name": "ZAICO Attestations — Gold",
      "tier": "Gold",
      "format": "SVG",
      "created": "2025-08-27",
      "rights": "For ZAICO Attestations",
      "attributes": [
        {"trait_type":"Tier","value":"Gold"},
        {"trait_type":"Type","value":"Attestation Badge"}
      ]
    }
  </metadata>
  <defs>
    <radialGradient id="grad-gold-base" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFF7CC"/>
      <stop offset="45%" stop-color="#FFD56A"/>
      <stop offset="100%" stop-color="#C89200"/>
    </radialGradient>
    <linearGradient id="grad-gold-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#B17E00"/>
    </linearGradient>
    <radialGradient id="grad-gold-star" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5C7"/>
      <stop offset="100%" stop-color="#E0B83A"/>
    </radialGradient>
    <linearGradient id="grad-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B2B2B"/>
      <stop offset="100%" stop-color="#1C1C1C"/>
    </linearGradient>
    <filter id="ds-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clip-medal">
      <circle cx="512" cy="512" r="380"/>
    </clipPath>
    <style>
      @supports(font-variation-settings:normal){
        .ui { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", Arial, sans-serif; }
      }
      .title { font-weight: 700; letter-spacing: 4px; }
      .tier  { font-weight: 800; letter-spacing: 6px; }
      .small { font-size: 20px; opacity: .7; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Ombra -->
  <g filter="url(#ds-gold)">
    <!-- Base -->
    <circle cx="512" cy="512" r="380" fill="url(#grad-gold-base)"/>

    <!-- Anello esterno -->
    <circle cx="512" cy="512" r="360" fill="none" stroke="url(#grad-gold-ring)" stroke-width="24"/>

    <!-- Pattern lucido superiore -->
    <ellipse cx="512" cy="380" rx="260" ry="120" fill="#FFFFFF" opacity=".18"/>

    <!-- Big Z watermark -->
    <text x="512" y="560" class="ui" fill="#000" opacity=".08" font-size="420" text-anchor="middle">Z</text>

    <!-- Testo superiore -->
    <text x="512" y="280" class="ui title" fill="#2A2100" font-size="40" text-anchor="middle">ZAICO ATTESTATIONS</text>
    <text x="512" y="318" class="ui small" fill="#2A2100" text-anchor="middle">SERIES 2025</text>

    <!-- Stella -->
    <polygon points="512.0,342.0 553.1,455.4 673.7,459.5 578.6,533.6 611.9,649.5 512.0,582.0 412.1,649.5 445.4,533.6 350.3,459.5 470.9,455.4"
             fill="url(#grad-gold-star)" stroke="#9C6C00" stroke-width="6"/>

    <!-- Tratteggio interno -->
    <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 10"/>

    <!-- Nastro con livello -->
    <g>
      <rect x="252" y="682" width="520" height="96" rx="24" fill="url(#grad-ribbon)" stroke="#000" stroke-opacity=".3"/>
      <polygon points="252,730 192,702 192,758" fill="#151515"/>
      <polygon points="772,730 832,702 832,758" fill="#151515"/>
      <text x="512" y="745" class="ui tier" fill="#FFFFFF" font-size="48" text-anchor="middle">GOLD</text>
    </g>
  </g>
</svg>
