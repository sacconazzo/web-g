<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ZAICO Attestations Logo Premium</title>
  <desc>Logo quadrato premium per ZAICO Attestations, sfondo nero, scritta dorata e argento.</desc>
  <metadata>
    {
      "name": "ZAICO Attestations Logo Premium",
      "format": "SVG",
      "created": "2025-08-27",
      "rights": "For ZAICO Attestations",
      "attributes": [
        {"trait_type":"Type","value":"Logo"},
        {"trait_type":"Style","value":"Premium Gold &amp; Silver"}
      ]
    }
  </metadata>
  <defs>
    <linearGradient id="grad-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD97A"></stop>
      <stop offset="50%" stop-color="#FFC93C"></stop>
      <stop offset="100%" stop-color="#B8860B"></stop>
    </linearGradient>
    <linearGradient id="grad-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F5F5"></stop>
      <stop offset="50%" stop-color="#CCCCCC"></stop>
      <stop offset="100%" stop-color="#999999"></stop>
    </linearGradient>
    <style>
      .bg { fill: #0A0A0A; }
      .zaico { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
               font-size: 240px; font-weight: 800; letter-spacing: 8px; fill: url(#grad-gold); }
      .att { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
             font-size: 80px; font-weight: 600; letter-spacing: 6px; fill: url(#grad-silver); }
    </style>
  </defs>

  <!-- Sfondo -->
  <rect width="1024" height="1024" class="bg"></rect>

  <!-- Testo ZAICO -->
  <text x="50%" y="48%" text-anchor="middle" dominant-baseline="middle" class="zaico">ZAICO</text>

  <!-- Testo ATTESTATIONS -->
  <text x="50%" y="68%" text-anchor="middle" class="att">ATTESTATIONS</text>
</svg>
