<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>ZAICO Attestations — BRONZE</title>
  <desc>Medaglia circolare color bronzo con stella, nastro e testo ZAICO Attestations - livello BRONZE.</desc>
  <metadata>
    {
      "name": "ZAICO Attestations — Bronze",
      "tier": "Bronze",
      "format": "SVG",
      "created": "2025-08-27",
      "rights": "For ZAICO Attestations",
      "attributes": [
        {"trait_type":"Tier","value":"Bronze"},
        {"trait_type":"Type","value":"Attestation Badge"}
      ]
    }
  </metadata>
  <defs>
    <radialGradient id="grad-bronze-base" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFE5CC"/>
      <stop offset="45%" stop-color="#E0A060"/>
      <stop offset="100%" stop-color="#7A3B11"/>
    </radialGradient>
    <linearGradient id="grad-bronze-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFDBB0"/>
