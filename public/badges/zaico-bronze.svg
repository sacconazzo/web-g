    <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-opacity=".32" stroke-width="2" stroke-dasharray="6 10"/>

    <g>
      <rect x="252" y="682" width="520" height="96" rx="24" fill="url(#grad-ribbon-bronze)" stroke="#000" stroke-opacity=".3"/>
      <polygon points="252,730 192,702 192,758" fill="#130C09"/>
      <polygon points="772,730 832,702 832,758" fill="#130C09"/>
