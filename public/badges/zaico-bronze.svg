    <linearGradient id="grad-ribbon-bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A1C18"/>
      <stop offset="100%" stop-color="#1A110E"/>
    </linearGradient>
    <filter id="ds-bronze" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
    <style>
      .ui { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", Arial, sans-serif; }
      .title { font-weight: 700; letter-spacing: 4px; }
      .tier  { font-weight: 800; letter-spacing: 6px; }
      .small { font-size: 20px; opacity: .7; letter-spacing: 2px; }
    </style>
  </defs>

  <g filter="url(#ds-bronze)">
    <circle cx="512" cy="512" r="380" fill="url(#grad-bronze-base)"/>
    <circle cx="512" cy="512" r="360" fill="none" stroke="url(#grad-bronze-ring)" stroke-width="24"/>
    <ellipse cx="512" cy="380" rx="260" ry="120" fill="#FFFFFF" opacity=".16"/>
    <text x="512" y="560" class="ui" fill="#000" opacity=".08" font-size="420" text-anchor="middle">Z</text>
    <text x="512" y="280" class="ui title" fill="#2A1409" font-size="40" text-anchor="middle">ZAICO ATTESTATIONS</text>
    <text x="512" y="318" class="ui small" fill="#2A1409" text-anchor="middle">SERIES 2025</text>

    <polygon points="512.0,342.0 553.1,455.4 673.7,459.5 578.6,533.6 611.9,649.5 512.0,582.0 412.1,649.5 445.4,533.6 350.3,459.5 470.9,455.4"
